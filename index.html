<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simalee</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: #e5e9ed;
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(255, 255, 255, 0.8) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(180, 190, 200, 0.5) 0%, transparent 50%);
            color: #2b323b;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        #orientation-warning {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(220, 226, 232, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 9999;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .glass-alert-box {
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 
                20px 20px 40px rgba(163, 177, 198, 0.4),
                -20px -20px 40px rgba(255, 255, 255, 0.8),
                inset 1px 1px 2px rgba(255, 255, 255, 0.9);
            border-radius: 24px;
            padding: 40px 30px;
            max-width: 320px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .phone-rotate-icon {
            width: 60px;
            height: 100px;
            border: 3px solid #4a5568;
            border-radius: 10px;
            position: relative;
            margin-bottom: 25px;
            background: rgba(255, 255, 255, 0.2);
            box-shadow: inset 2px 2px 5px rgba(163, 177, 198, 0.3);
            animation: rotatePhone 2s infinite ease-in-out;
        }

        .phone-rotate-icon::after {
            content: '';
            position: absolute;
            bottom: 6px;
            left: 50%;
            transform: translateX(-50%);
            width: 12px;
            height: 3px;
            background: #4a5568;
            border-radius: 2px;
        }

        @keyframes rotatePhone {
            0% { transform: rotate(0deg); }
            50% { transform: rotate(90deg); }
            100% { transform: rotate(90deg); }
        }

        .warning-title {
            font-size: 18px;
            font-weight: 700;
            color: #2b323b;
            margin-bottom: 10px;
        }

        .warning-text {
            font-size: 13px;
            color: #606c76;
            line-height: 1.5;
        }

        .main-content {
            text-align: center;
            padding: 20px;
            transition: opacity 1s cubic-bezier(0.4, 0, 0.2, 1), transform 1s cubic-bezier(0.4, 0, 0.2, 1), filter 1s ease;
        }

        .dissolving {
            opacity: 0;
            transform: scale(1.15);
            filter: blur(12px);
            pointer-events: none;
        }

        .main-card {
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow: 
                25px 25px 50px rgba(163, 177, 198, 0.35),
                -25px -25px 50px rgba(255, 255, 255, 0.9);
            border-radius: 28px;
            padding: 50px 70px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: box-shadow 0.3s ease;
        }

        .main-card:hover {
            box-shadow: 
                30px 30px 60px rgba(163, 177, 198, 0.45),
                -30px -30px 60px rgba(255, 255, 255, 0.95);
        }

        h1 {
            font-size: 32px;
            font-weight: 800;
            color: #2b323b;
            margin-bottom: 8px;
            letter-spacing: 1px;
            animation: waterRipple 3s infinite ease-in-out;
            display: inline-block;
        }

        @keyframes waterRipple {
            0% {
                transform: scale(1);
                text-shadow: 0 0 0 rgba(43, 50, 59, 0);
            }
            50% {
                transform: scale(1.03);
                text-shadow: 0 0 15px rgba(163, 177, 198, 0.8), 0 0 30px rgba(255, 255, 255, 0.6);
            }
            100% {
                transform: scale(1);
                text-shadow: 0 0 0 rgba(43, 50, 59, 0);
            }
        }

        p {
            font-size: 13px;
            color: #606c76;
            letter-spacing: 0.5px;
        }

        /* Полноэкранное меню */
        #fullscreen-menu {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #e5e9ed;
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(255, 255, 255, 0.8) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(180, 190, 200, 0.5) 0%, transparent 50%);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1s cubic-bezier(0.4, 0, 0.2, 1);
            padding: 30px;
        }

        #fullscreen-menu.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* Верхняя панель меню: кнопка назад строго слева вверху поверх всего */
        .menu-top-bar {
            width: 100%;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            margin-bottom: 20px;
            z-index: 1001;
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow: 6px 6px 14px rgba(163, 177, 198, 0.3), -6px -6px 14px rgba(255, 255, 255, 0.8);
            padding: 10px 20px;
            border-radius: 14px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            color: #2b323b;
            transition: all 0.2s ease;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.9);
            transform: translateY(-2px);
        }

        /* Центрированная сетка кнопок */
        .menu-wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
        }

        .menu-container {
            max-width: 650px;
            width: 100%;
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow: 
                25px 25px 50px rgba(163, 177, 198, 0.35),
                -25px -25px 50px rgba(255, 255, 255, 0.9);
            border-radius: 28px;
            padding: 30px;
            text-align: center;
        }

        .menu-title {
            font-size: 20px;
            font-weight: 700;
            color: #2b323b;
            margin-bottom: 20px;
            letter-spacing: 0.5px;
        }

        /* Сетка кнопок меню */
        .nav-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .nav-btn {
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 
                8px 8px 18px rgba(163, 177, 198, 0.3),
                -8px -8px 18px rgba(255, 255, 255, 0.8);
            padding: 18px 10px;
            border-radius: 16px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            color: #2b323b;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .nav-btn:hover {
            background: rgba(255, 255, 255, 0.8);
            transform: translateY(-2px);
            box-shadow: 
                10px 10px 22px rgba(163, 177, 198, 0.4),
                -10px -10px 22px rgba(255, 255, 255, 0.9);
        }

        .nav-btn:active {
            box-shadow: 
                inset 4px 4px 8px rgba(163, 177, 198, 0.4),
                inset -4px -4px 8px rgba(255, 255, 255, 0.9);
            transform: translateY(0);
        }

        @media screen and (max-width: 900px) and (orientation: portrait) {
            #orientation-warning {
                display: flex;
            }
        }
    </style>
</head>
<body>

    <div id="orientation-warning">
        <div class="glass-alert-box">
            <div class="phone-rotate-icon"></div>
            <div class="warning-title">Поворот экрана</div>
            <div class="warning-text">Пожалуйста, поверните телефон горизонтально для корректного просмотра.</div>
        </div>
    </div>

    <div class="main-content" id="mainScreen">
        <div class="main-card" onclick="triggerDissolve()">
            <h1>Simalee</h1>
            <p>нажмите для входа</p>
        </div>
    </div>

    <div id="fullscreen-menu">
        <div class="menu-top-bar">
            <button class="back-btn" onclick="goBack()">← Назад</button>
        </div>
        <div class="menu-wrapper">
            <div class="menu-container">
                <div class="menu-title">Выберите раздел</div>
                <div class="nav-grid">
                    <button class="nav-btn" onclick="playClickSound()">🎨 Дизайн</button>
                    <button class="nav-btn" onclick="playClickSound()">📐 3D визуализация</button>
                    <button class="nav-btn" onclick="playClickSound()">💻 Программирование</button>
                    <button class="nav-btn" onclick="playClickSound()">💡 Консультация</button>
                    <button class="nav-btn" onclick="playClickSound()">ℹ️ Информация</button>
                    <button class="nav-btn" onclick="playClickSound()">💬 Чат</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Синтезатор звуков через Web Audio API (без внешних файлов)
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // Мелодия из пары нот при повороте / инициализации
        function playRotateMelody() {
            initAudio();
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            
            // Нота 1
            const osc1 = audioCtx.createOscillator();
            const gain1 = audioCtx.createGain();
            osc1.type = 'sine';
            osc1.frequency.setValueAtTime(440, now); // A4
            gain1.gain.setValueAtTime(0.1, now);
            gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
            osc1.connect(gain1);
            gain1.connect(audioCtx.destination);
            osc1.start(now);
            osc1.stop(now + 0.3);

            // Нота 2
            const osc2 = audioCtx.createOscillator();
            const gain2 = audioCtx.createGain();
            osc2.type = 'sine';
            osc2.frequency.setValueAtTime(659.25, now + 0.15); // E5
            gain2.gain.setValueAtTime(0.1, now + 0.15);
            gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
            osc2.connect(gain2);
            gain2.connect(audioCtx.destination);
            osc2.start(now + 0.15);
            osc2.stop(now + 0.5);
        }

        // Звук нажатия на главную надпись
        function playMainClickSound() {
            initAudio();
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(300, now);
            osc.frequency.exponentialRampToValueAtTime(150, now + 0.2);
            gain.gain.setValueAtTime(0.15, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.2);
        }

        // Звук для кнопок меню
        function playClickSound() {
            initAudio();
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(587.33, now); // D5
            gain.gain.setValueAtTime(0.08, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.15);
        }

        function checkOrientation() {
            const warning = document.getElementById('orientation-warning');
            if (window.innerWidth <= 900 && window.innerHeight > window.innerWidth) {
                warning.style.display = 'flex';
            } else {
                warning.style.display = 'none';
                playRotateMelody();
            }
        }

        window.addEventListener('load', checkOrientation);
        window.addEventListener('resize', checkOrientation);
        window.addEventListener('orientationchange', checkOrientation);

        function triggerDissolve() {
            // Тактильная вибрация (если поддерживается устройством)
            if (navigator.vibrate) {
                navigator.vibrate([40, 30, 40]);
            }

            playMainClickSound();

            const mainScreen = document.getElementById('mainScreen');
            const menu = document.getElementById('fullscreen-menu');

            mainScreen.classList.add('dissolving');

            let elem = document.documentElement;
            if (elem.requestFullscreen) {
                elem.requestFullscreen().catch(() => {});
            } else if (elem.webkitRequestFullscreen) {
                elem.webkitRequestFullscreen();
            }

            setTimeout(() => {
                menu.classList.add('active');
            }, 900);
        }

        function goBack() {
            playClickSound();
            const mainScreen = document.getElementById('mainScreen');
            const menu = document.getElementById('fullscreen-menu');

            menu.classList.remove('active');

            if (document.exitFullscreen) {
                document.exitFullscreen().catch(() => {});
            } else if (document.webkitExitFullscreen) {
                document.webkitExitFullscreen();
            }

            setTimeout(() => {
                mainScreen.classList.remove('dissolving');
            }, 300);
        }
    </script>
</body>
</html>
