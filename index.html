<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simalee Design | Studio 侘寂</title>
    <style>
        :root { --bg: #f2efe9; --text: #2b2b2b; --shadow-light: #ffffff; --shadow-dark: #d5d1c8; --accent: #3e5c43; --accent-light: #6b8e73; --danger: #c86d51; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
        body { background: var(--bg); color: var(--text); min-height: 100vh; padding: 20px; display: flex; justify-content: center; align-items: center; background-image: radial-gradient(rgba(62, 92, 67, 0.05) 1px, transparent 0); background-size: 24px 24px; }
        .container { width: 100%; max-width: 900px; }
        .neu-card { background: var(--bg); border-radius: 20px; box-shadow: 8px 8px 18px var(--shadow-dark), -8px -8px 18px var(--shadow-light); padding: 35px; margin-bottom: 25px; border: 1px solid rgba(255,255,255,0.4); border-left: 4px solid var(--accent); position: relative; overflow: hidden; animation: cardAppear 0.4s ease; }
        @keyframes cardAppear { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .jp-watermark { position: absolute; right: 15px; bottom: 5px; font-size: 70px; font-weight: bold; color: rgba(62, 92, 67, 0.04); pointer-events: none; user-select: none; }
        .neu-input, .neu-select { width: 100%; border: none; padding: 15px 20px; border-radius: 12px; background: var(--bg); box-shadow: inset 3px 3px 6px var(--shadow-dark), inset -3px -3px 6px var(--shadow-light); color: var(--text); font-size: 15px; outline: none; margin-bottom: 15px; resize: vertical; transition: all 0.3s ease; appearance: none; }
        .neu-input:focus, .neu-select:focus { box-shadow: inset 4px 4px 8px var(--shadow-dark), inset -4px -4px 8px var(--shadow-light), 0 0 0 2px var(--accent-light); }
        .neu-btn { border: none; padding: 12px 24px; border-radius: 12px; cursor: pointer; background: var(--bg); color: var(--accent); font-weight: 600; font-size: 15px; box-shadow: 5px 5px 10px var(--shadow-dark), -5px -5px 10px var(--shadow-light); transition: all 0.25s ease; margin-right: 8px; margin-bottom: 10px; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; }
        .neu-btn:hover { color: var(--accent-light); transform: translateY(-2px); box-shadow: 7px 7px 14px var(--shadow-dark), -7px -7px 14px var(--shadow-light); }
        .neu-btn:active { box-shadow: inset 3px 3px 6px var(--shadow-dark), inset -3px -3px 6px var(--shadow-light); transform: translateY(0); }
        .btn-danger { color: var(--danger); }
        .hidden { display: none !important; }
        .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; margin-top: 15px; }
        .gallery-item { position: relative; width: 100%; padding-top: 100%; border-radius: 14px; overflow: hidden; box-shadow: 4px 4px 10px var(--shadow-dark), -4px -4px 10px var(--shadow-light); background: var(--bg); border: 2px solid rgba(255,255,255,0.6); display: block; transition: all 0.3s ease; text-decoration: none; color: var(--text); }
        .gallery-item:hover { transform: translateY(-3px) scale(1.02); box-shadow: 7px 7px 15px var(--shadow-dark), -5px -5px 12px var(--shadow-light); }
        .gallery-item img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; display: block; border-radius: 12px; z-index: 2; transition: opacity 0.3s ease; }
        .gallery-placeholder { position: absolute; top:0; left:0; width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:10px; text-align:center; font-size:12px; font-weight:600; color:var(--accent); z-index: 1; }
        .chat-box { background: var(--bg); padding: 20px; border-radius: 16px; box-shadow: inset 3px 3px 6px var(--shadow-dark), inset -3px -3px 6px var(--shadow-light); margin-top: 15px; max-height: 280px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; text-align: left; }
        .chat-msg { padding: 10px 15px; border-radius: 12px; max-width: 80%; font-size: 14px; line-height: 1.4; word-break: break-word; }
        .msg-client { background: var(--accent); color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
        .msg-designer { background: rgba(255,255,255,0.85); color: var(--text); align-self: flex-start; border-bottom-left-radius: 2px; box-shadow: 2px 2px 5px var(--shadow-dark); }
        .project-item { display: flex; flex-direction: column; gap: 10px; padding: 18px 20px; border-radius: 14px; margin-bottom: 15px; box-shadow: inset 2px 2px 5px var(--shadow-dark), inset -2px -2px 5px var(--shadow-light); background: rgba(255,255,255,0.2); }
        .project-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .project-icon { font-size: 22px; margin-right: 10px; vertical-align: middle; display: inline-block; }
        .comment-box { background: var(--bg); padding: 20px; border-radius: 12px; box-shadow: inset 3px 3px 6px var(--shadow-dark), inset -3px -3px 6px var(--shadow-light); line-height: 1.7; white-space: pre-line; margin-top: 10px; border-left: 3px solid var(--accent-light); }
        .video-list { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
        .jp-sub { font-size: 12px; color: var(--accent); opacity: 0.8; font-weight: normal; margin-left: 6px; letter-spacing: 1px; }
    </style>
</head>
<body>
    <div class="container">
        <div id="projectCard" class="neu-card">
            <h1 id="pTitle">Проект</h1>
            <div id="pCommentsBlock" style="margin-top:20px;">
                <h3>Заметки мастера <span class="jp-sub">[ 助言 ]</span></h3>
                <div id="pComments" class="comment-box">Тестовая заметка</div>
            </div>
            <div id="pGalleryBlock" style="margin-top:25px;">
                <h3>Эскизы и чертежи <span class="jp-sub">[ 図面 ]</span></h3>
                <div id="pGallery" class="gallery"></div>
            </div>
        </div>
    </div>
    <script>
        function processImageUrl(url, imgId) {
            const imgEl = document.getElementById(imgId);
            if (!imgEl) return;
            
            if (url.includes('disk.yandex') || url.includes('yadi.sk')) {
                const apiUrl = 'https://cloud-api.yandex.net/v1/disk/public/resources?public_key=' + encodeURIComponent(url) + '&preview_size=M&preview_crop=true';
                fetch(apiUrl)
                    .then(r => r.json())
                    .then(data => {
                        if (data.preview) {
                            imgEl.src = data.preview;
                        } else if (data.sizes && data.sizes.length) {
                            imgEl.src = data.sizes[0].url;
                        }
                    })
                    .catch(() => {});
            } else {
                imgEl.src = url;
            }
        }
        function renderGallery(urls) {
            const container = document.getElementById('pGallery');
            container.innerHTML = '';
            urls.forEach((url, i) => {
                const imgId = 'sketch_img_' + i;
                const html = '<a href="' + url + '" target="_blank" class="gallery-item">'
                           + '<div class="gallery-placeholder">🖼️ Открыть эскиз #' + (i+1) + '</div>'
                           + '<img id="' + imgId + '" alt="Эскиз" onerror="this.style.opacity=0;">' 
                           + '</a>';
                container.innerHTML += html;
                setTimeout(() => processImageUrl(url, imgId), 50);
            });
        }
        document.addEventListener('DOMContentLoaded', () => {
            renderGallery([
                'https://i.imgur.com/8N41G3C.jpeg',
                'https://i.imgur.com/2nL8332.jpeg'
            ]);
        });
    </script>
</body>
</html>
